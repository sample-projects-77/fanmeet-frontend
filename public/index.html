<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Fan Session – Book personal video sessions with session providers" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://s3-fanmeet-bucket.s3.us-east-1.amazonaws.com" crossorigin />
    <link rel="dns-prefetch" href="https://s3-fanmeet-bucket.s3.us-east-1.amazonaws.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <title>Fan Session</title>
    <script>
      /* Resolve and stamp the theme before the first paint so a light-mode user
         never sees a flash of the dark UI while the bundle loads.
         Mirrors resolveInitialTheme() in src/utils/themeStorage.js:
           localStorage 'theme' -> cached user.theme_mode -> 'light' (default).
         Dark Mode removes the attribute, leaving the original :root palette. */
      (function () {
        try {
          var ok = function (v) { return v === 'light' || v === 'dark' ? v : null; };
          var mode = ok(localStorage.getItem('theme'));
          if (!mode) {
            var raw = localStorage.getItem('user');
            if (raw) mode = ok(JSON.parse(raw).theme_mode);
          }
          mode = mode || 'light';
          if (mode === 'light') document.documentElement.setAttribute('data-theme', 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'light' ? '#F6F7F9' : '#000000');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
